[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spot-e"
version = "0.1.0"
description = "Plug-and-play SPOT-E test-time visual spotlight component."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "pillow>=9.5",
]

[tool.setuptools.packages.find]
include = ["spot_e*"]
